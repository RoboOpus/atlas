name: Refresh OpenReview Venue Registry

on:
  schedule:
    - cron: '45 8 * * 1'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'RoboOpus/atlas'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh venue registry
        run: npm run frontier:venues

      - name: Validate site and data
        run: npm run build

      - name: Detect registry changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- content/venue-registry.json site/data/venue-registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Commit changed registry
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "RoboOpus Frontier"
          git config user.email "actions@users.noreply.github.com"
          git add content/venue-registry.json site/data/venue-registry.json
          git commit -m "chore(frontier): refresh OpenReview venues"
          git push

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: needs.refresh.outputs.changed == 'true'
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
